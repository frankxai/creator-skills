name: Skill request
description: Propose a new skill or an improvement to an existing one
title: "Skill request: "
labels: [enhancement]
body:
  - type: input
    id: problem
    attributes:
      label: Creator problem
      description: What decision or production step needs better guidance?
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: When should it activate?
      description: Give a realistic user request, destination, and expected deliverable.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or existing solutions
      description: Note required engines, paid services, rights, consent, and similar skills.
